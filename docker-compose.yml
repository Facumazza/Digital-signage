services:
  postgres:
    image: postgres:16-alpine
    container_name: signage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage
      POSTGRES_USER: signage
      POSTGRES_PASSWORD: signage
    ports:
      - "5432:5432"
    volumes:
      - signage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage -d signage"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  signage-pgdata:
