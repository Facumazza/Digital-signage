spring.application.name=grenlus-signage
server.port=8080

# ---- PostgreSQL ----
# Los valores por defecto coinciden con el docker-compose.yml de la raiz.
# Para sobreescribirlos sin tocar este archivo usar variables de entorno
# o crear application-local.properties (esta ignorado por git).
spring.datasource.url=jdbc:postgresql://${SIGNAGE_DB_HOST:localhost}:${SIGNAGE_DB_PORT:5432}/${SIGNAGE_DB_NAME:signage}
spring.datasource.username=${SIGNAGE_DB_USER:signage}
spring.datasource.password=${SIGNAGE_DB_PASSWORD:signage}

# ---- JPA / Hibernate ----
# update: Hibernate crea y actualiza las tablas solo. Alcanza para el MVP.
# No usar en produccion: ahi corresponde migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Storage de archivos ----
# Directorio donde se guardan videos e imagenes. Esta ignorado por git.
signage.storage.ruta=${SIGNAGE_STORAGE_RUTA:./uploads}

# Limites de subida. Por defecto Spring corta en 1MB, que no alcanza para
# ningun video: sin esto cualquier MP4 falla con MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- CORS ----
# Origen del panel React. Separar con coma para permitir varios.
signage.cors.origenes=${SIGNAGE_CORS_ORIGENES:http://localhost:5173}
