spring.application.name=grenlus-signage
server.port=8080

# ---- PostgreSQL ----
# Los valores por defecto coinciden con el docker-compose.yml de la raiz.
# Para sobreescribirlos sin tocar este archivo usar variables de entorno
# o crear application-local.properties (esta ignorado por git).
spring.datasource.url=jdbc:postgresql://${SIGNAGE_DB_HOST:localhost}:${SIGNAGE_DB_PORT:5432}/${SIGNAGE_DB_NAME:signage}
spring.datasource.username=${SIGNAGE_DB_USER:signage}
spring.datasource.password=${SIGNAGE_DB_PASSWORD:signage}

# ---- JPA / Hibernate ----
# update: Hibernate crea y actualiza las tablas solo. Alcanza para el MVP.
# No usar en produccion: ahi corresponde migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Storage de archivos ----
# Directorio donde se guardan videos e imagenes. Esta ignorado por git.
signage.storage.ruta=${SIGNAGE_STORAGE_RUTA:./uploads}

# Limites de subida. Por defecto Spring corta en 1MB, que no alcanza para
# ningun video: sin esto cualquier MP4 falla con MaxUploadSizeExceededException.
# Un poco por encima del maximo por tipo de archivo que valida el service, para
# que una subida gigante se corte al llegar en vez de transferirse entera y
# recien despues ser rechazada.
spring.servlet.multipart.max-file-size=210MB
spring.servlet.multipart.max-request-size=210MB

# Duracion maxima de un video, en segundos. Un video largo pesa mucho: tarda en
# llegar a cada pantalla, ocupa el disco del TV Box y deja mas tiempo la
# cartelera mostrando lo mismo. La mide el panel antes de subir el archivo.
signage.contenido.duracion-maxima-video=${SIGNAGE_DURACION_MAXIMA_VIDEO:120}

# Peso maximo de cada archivo. A diferencia de la duracion, esto el servidor lo
# verifica solo: la duracion la mide el panel y se le cree. 120 segundos de
# 1080p bien comprimidos rondan los 120 MB, asi que 200 deja margen.
signage.contenido.tamano-maximo-video-mb=${SIGNAGE_TAMANO_MAXIMO_VIDEO_MB:200}
signage.contenido.tamano-maximo-imagen-mb=${SIGNAGE_TAMANO_MAXIMO_IMAGEN_MB:20}

# ---- CORS ----
# Origen del panel React. Separar con coma para permitir varios.
signage.cors.origenes=${SIGNAGE_CORS_ORIGENES:http://localhost:5173}

# ---- Seguridad ----
# El secreto firma los JWT. HS256 necesita 32 caracteres como minimo.
# ESTE VALOR ES SOLO PARA DESARROLLO: esta en el repo, asi que cualquiera que
# lo lea puede firmar tokens validos. En produccion va por variable de entorno.
signage.jwt.secreto=${SIGNAGE_JWT_SECRETO:cambiar-este-secreto-de-desarrollo-32+}
signage.jwt.duracion-ms=${SIGNAGE_JWT_DURACION_MS:28800000}

# Primer SUPER_ADMIN, solo si la base no tiene usuarios. Sin esto no habria
# forma de crear el primero, porque crear usuarios exige ser SUPER_ADMIN.
signage.admin-inicial.email=${SIGNAGE_ADMIN_EMAIL:admin@grenlus.com}
signage.admin-inicial.password=${SIGNAGE_ADMIN_PASSWORD:admin1234}
